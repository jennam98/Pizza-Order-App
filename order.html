<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenna's Pizzeria</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>  
    <header>
        <h1>Jenna's Pizzeria</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="order.html">Order Online</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>

    </header>
    <main>
        <form>

            <div id="pickup-or-delivery">
                <h1>Pickup or Delivery </h1>

                <input type="radio" id="pickup"
                value="pickup">
                <label for="pickup"> Pick-up</label><br>
                
                <input type="radio" id="delivery" value="delivery">
                <label for="delivery"> Delivery</label><br>
            </div>

            <div id="delivery-info">
                <h2>Delivery Information</h2>


                 <label for="fname">  First Name</label>
                 <input type="text"
                 id="fname"><br>

                 <label for="lname">    Last Name</label>
                 <input type="text"
                 id="lname"><br>

                 <label for="phone">    Phone Number</label>
                 <input type="text"
                 id="phone"><br>

                 <label for="address">   Address</label>
                 <input type="text"
                 id="address">
            </div>

            <div id="size">           
                 <h1> Size</h1>
                 <input type="radio" id="small" value="small">
                 <label for="small"> Small (10")</label><br>

                 <input type="radio" id="medium" value="medium">
                 <label for="medium"> Medium (12") </label><br>

                 <input type="radio" id="large" value="large">
                 <label for="large"> Large (14")</label><br>

                 <input type="radio" id="x-large" value="x-large">
                 <label for="x-large">  X-Large (16")</label>
            </div>

            <div id="crust">
                 <h1>Crust</h1>
                 <input type="radio"  id="thin" value="thin">
                 <label for="thin"> Thin</label><br>

                 <input type="radio" id="regular" value="regular">
                 <label for="regular"> Regular</label><br>

                 <input type="radio" id="stuffed" value="stuffed">
                 <label for="stuffed"> Stuffed <small> ($2.00 extra)</small></label><br>
            </div>


            <h1>Toppings</h1>
            <p><small>($0.99 per topping)</small></p>
            <input type="checkbox" id="pepperoni" value="pepperoni">
            <label for="pepperoni"> Pepperoni </label><br>

            <input type="checkbox" id="sausage" value="sausage">
            <label for="sausage"> Sausage </label><br>

            <input type="checkbox" id="bacon" value="bacon">
            <label for="bacon"> Bacon </label><br>

            <input type="checkbox" id="mushroom" value="mushroom">
            <label for="mushroom"> Mushroom </label><br>

            <input type="checkbox" id="onion" value="onion">
            <label for="onion"> Red Onion </label><br>

            <input type="checkbox" id="tomato" value="tomato">
            <label for="tomato"> Tomato </label><br>

            <input type="checkbox" id="pepper" value="pepper">
            <label for="pepper"> Green Pepper </label><br>

            <input type="checkbox" id="jalapenos" value="jalapenos">
            <label for="jalapenos"> Jalapenos </label><br>

            <input type="checkbox" id="cheese" value="cheese">
            <label for="cheese"> Extra Cheese </label><br>

            
            




        </form>
     
       

    </main>
    <footer>
        <p>© 2024 Jenna's Pizzeria. All rights reserved.</p>
    </footer>
</body>
</html>
